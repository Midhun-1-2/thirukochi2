<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#540000" />
    <meta name="description" content="Thirukochi Gold & Diamonds — digital gold savings, live gold rates and jewellery schemes. Tradition meets tomorrow." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/logo/thirukochi-emblem.png" />
    <title>Thirukochi Gold & Diamonds</title>
    <!-- first paint before the bundle lands: the splash's own maroon, so the app never flashes cream -->
    <style>
      body { margin: 0; }
      #root:empty { min-height: 100dvh; background: linear-gradient(160deg, #6a0a0a 0%, #540000 45%, #3a0000 100%); }
    </style>
    <!-- splash logo starts downloading with the bundle instead of after React mounts -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/assets/logo/thirukochi-logo-800.webp"
      imagesrcset="/assets/logo/thirukochi-logo-400.webp 400w, /assets/logo/thirukochi-logo-800.webp 800w, /assets/logo/thirukochi-logo-1200.webp 1200w, /assets/logo/thirukochi-logo.webp 2262w"
      imagesizes="280px"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
